{% extends "base.html" %} {% block content %}
<div class="card" style="width: 100%">
  <h2 class="card-title">个人设置</h2>
  <form method="post" action="{{ url_for('main.profile') }}">
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" class="form-control" id="username" name="username" value="{{ user.username or '' }}" readonly disabled />
    </div>
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required />
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" class="form-control" id="password" name="password" value="{{ user.password or '' }}" />
    </div>
    <div class="form-group">
      <label> <input type="checkbox" name="email_send" {% if user.email_send %}checked{% endif %} /> 接收邮件提醒 </label>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%">保存修改</button>
  </form>
</div>
{% endblock %}
